[project]
name = "copier-python-package"
version = "0.1.0"
description = "Copier template for bootstrapping uv-managed Python packages"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*", "COPYRIGHT"]
authors = [{ name = "Andrew Ridyard", email = "andyrids.culprit320@passmail.com" }]
maintainers = [{ name = "Andrew Ridyard", email = "andyrids.culprit320@passmail.com" }]
requires-python = ">=3.11"
keywords = ["DevEx", "copier", "package", "template"]
classifiers = [
    # 3 - Alpha | 4 - Beta | 5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Private :: Do Not Upload",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/andyrids/copier-python-package/blob/main/README.md"
Repository = "https://github.com/andyrids/copier-python-package"
Issues = "https://github.com/andyrids/copier-python-package/issues"
Changelog = "https://github.com/andyrids/copier-python-package/blob/main/CHANGELOG.md"

[[tool.uv.index]]
name = "gitlab"
url = "https://gitlab.com/api/v4/projects/82928123/packages/pypi/simple"
explicit = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: renders the template and runs the generated project toolchain (slow, needs network)",
]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
tmp_path_retention_policy = "failed"

[tool.uv.sources]
pkgdx = { index = "gitlab" }

[dependency-groups]
dev = [
    "copier>=9.5.0",
    "coverage>=7.14.0",
    "pkgdx~=0.4.1",
    "pytest>=9.0.3",
    "pytest-copier>=0.4.1",
]
